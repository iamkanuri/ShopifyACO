<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#16171b"/>
  <g transform="translate(80,86)">
    <!-- aperture mark (matches favicon / in-app logo) -->
    <g transform="translate(0,2)" fill="none" stroke="#dedcd5" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="26" cy="26" r="20"/>
      <path d="M26 13 L37 32 L15 32 Z"/>
      <circle cx="26" cy="26" r="3.6" fill="#dedcd5" stroke="none"/>
    </g>
    <text x="68" y="22" font-size="22" fill="#dedcd5" font-family="Arial, sans-serif" font-weight="bold">AisleLens</text>
    <text x="68" y="46" font-size="16" fill="#908e87" font-family="Arial, sans-serif">AI Commerce QA for Shopify</text>
  </g>
  <text x="80" y="296" font-size="54" fill="#dedcd5" font-family="Arial, sans-serif" font-weight="bold">AI buyers treat your store</text>
  <text x="80" y="366" font-size="54" fill="#dedcd5" font-family="Arial, sans-serif" font-weight="bold">like an API. We test it like one.</text>
  <text x="80" y="442" font-size="27" fill="#908e87" font-family="Arial, sans-serif">Executable shopping tests against your products, variants,</text>
  <text x="80" y="480" font-size="27" fill="#908e87" font-family="Arial, sans-serif">inventory &amp; policies — the exact requirement that failed, with evidence.</text>
  <g transform="translate(80,536)">
    <rect width="220" height="58" rx="12" fill="#dedcd5"/>
    <text x="110" y="37" font-size="22" fill="#16171b" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Run a free test</text>
  </g>
</svg>
